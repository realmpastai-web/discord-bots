version: '3.8'

services:
  moderation-bot:
    build: .
    container_name: quantbit-moderation-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    # No ports needed - bot connects to Discord gateway

volumes:
  data:
    driver: local
